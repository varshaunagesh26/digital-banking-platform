server:
  port: 0 # Automatically uses a random available port to prevent test failures

spring:
  application:
    name: payment-service

  # Bypasses your real production Kafka configuration file during testing
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

  # Redirects Flyway to your temporary, local RAM engine
  flyway:
    enabled: true
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    user: sa
    password: ""
    schemas: payment
    create-schemas: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

  # Redirects your database engine to the same internal RAM database instance
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    properties:
      hibernate:
        default_schema: payment
        dialect: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate # Ensures tables are validated against Flyway scripts

services:
  account-service:
    url: http://localhost:0

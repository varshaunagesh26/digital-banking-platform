server:
  port: 8082

spring:
  application:
    name: payment-service

  config:
    import:
      - classpath:kafka.yaml


  flyway:
    enabled: true
    schemas: payment
    create-schemas: true
    locations: classpath:db/migration
    url: jdbc:postgresql://localhost:5432/postgres
    user: admin
    password: admin
    baseline-on-migrate: true
    baseline-version: 0
    repair-on-migrate: true

  datasource:
    url: jdbc:postgresql://localhost:5432/postgres?currentSchema=payment&serverTimezone=Asia/Calcutta
    username: admin
    password: admin
    driver-class-name: org.postgresql.Driver
    hikari:
      schema: payment

  jpa:
    properties:
      hibernate:
        default_schema: payment
    hibernate:
      ddl-auto: update


# ✅ feign at root level
feign:
  client:
    config:
      account-service:
        connect-timeout: 5000
        read-timeout: 10000
        logger-level: FULL
  compression:
    request:
      enabled: true
    response:
      enabled: true

# ✅ logging at root level
logging:
  level:
    root: INFO
    com.db.payment.feign.client: DEBUG
    org.flywaydb: DEBUG

debug: true

services:
  account-service:
    url: https://localhost:8082
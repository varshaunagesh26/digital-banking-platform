spring:
  application:
    name: transaction-service

  config:
    import:
      - classpath:kafka.yml


  flyway:
    enabled: true
    schemas: transaction
    create-schemas: true
    locations: classpath:db/migration
    url: jdbc:postgresql://localhost:5432/postgres
    user: admin
    password: admin
    baseline-on-migrate: true
    baseline-version: 0

  datasource:
    url: jdbc:postgresql://localhost:5432/postgres?currentSchema=transaction&serverTimezone=Asia/Calcutta
    username: admin
    password: admin
    driver-class-name: org.postgresql.Driver
    hikari:
      schema: transaction

  jpa:
    properties:
      hibernate:
        default_schema: transaction
    hibernate:
      ddl-auto: update


# ✅ feign at root level
feign:
  client:
    config:
      account-service:
        connect-timeout: 5000
        read-timeout: 10000
        logger-level: FULL
  compression:
    request:
      enabled: true
    response:
      enabled: true

# ✅ logging at root level
logging:
  level:
    com.db.transaction.feign.client: DEBUG
    org.flywaydb: DEBUG

services:
  account-service:
    url: https://localhost:8081




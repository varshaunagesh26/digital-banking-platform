server:
  port: 0   # random port; irrelevant for MockMvc but avoids clashes if anything binds one

spring:
  application:
    name: account-service-test

  # 1. Flyway migrations run against the H2 instance below
  flyway:
    enabled: true
    schemas: account
    locations: classpath:db/migrations-test
    create-schemas: false   # H2's INIT param (below) already creates the schema before Flyway runs

  # 2. In-memory H2 standing in for Postgres.
  #    INIT creates the "account" schema during connection bootstrap - before
  #    Hikari's own connection.setSchema("account") call (below) runs. Without
  #    this, that call fails with "Schema account not found" because Flyway
  #    hasn't created it yet at that point. This is the H2 equivalent of the
  #    "account" schema you created by hand in DBeaver against real Postgres -
  #    nothing does that step for you automatically here, so INIT does it.
  datasource:
    url: jdbc:h2:mem:account_service_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;INIT=CREATE SCHEMA IF NOT EXISTS account
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      schema: account

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  # 3. Kafka bootstrap value is unused at runtime - KafkaTemplate is
  #    @MockitoBean'd in BaseIntegrationTest. auto-startup: false stops the
  #    real @KafkaListener container from starting a consumer thread /
  #    connecting to a broker, using your ACTUAL production
  #    ConcurrentKafkaListenerContainerFactory bean as-is - no need to
  #    hand-recreate it in test code with a possibly-mismatched generic type.
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: test-account-consumer-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: com.digital.backend.events.TransactionEvent
    listener:
      ack-mode: manual_immediate
      auto-startup: false   # replaces the old KafkaListenerTestConfig @Bean override

# 4. Swagger disabled during integration tests - faster context boot, same as your original file
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false